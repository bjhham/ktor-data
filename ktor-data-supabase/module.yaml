product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, iosX64 ]
dependencies:
  - ../ktor-data
  - ../ktor-data-serialization
  - $kotlin.serialization.core
  - $kotlin.serialization.json
  - $libs.kotlinx.atomicfu
  - $libs.kotlinx.coroutines.core
  - $libs.supabase.auth
  - $libs.supabase.postgrest
  - $libs.supabase.realtime
test-dependencies:
  # The repository is tested against a mock engine; a real deployment supplies its own
  # websocket-capable Ktor engine for Realtime.
  - $ktor.client.mock
  - $libs.kotlinx.coroutines.test
settings:
  kotlin:
    serialization:
      enabled: true
      version: 1.11.0
  ktor:
    enabled: true
